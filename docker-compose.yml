services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      retries: 10
  server:
    build: ./server
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/smart_library_db
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      CLIENT_URL: http://localhost:8080,http://127.0.0.1:8080
    ports: ["5000:5000"]
    depends_on:
      mongo: { condition: service_healthy }
  client:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    ports: ["8080:80"]
    depends_on: [server]
volumes:
  mongo_data:
